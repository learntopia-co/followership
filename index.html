    <script src="https://cdn.tailwindcss.com"></script>

            color: #1f2937;
        }

            background-color: #f9fafb;
        }
        /* Custom radio button styles for better mobile experience */
        .radio-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 0.375rem;
            transition: background-color 0.2s;
        }
        .radio-label:hover {
            background-color: #e5e7eb;
        }
        input[type="radio"]:checked + span {
            font-weight: bold;
            color: #2563eb;
        }

</head>
<body class="min-h-screen p-4 md:p-8">

<div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden" id="capture-area">
    
    <!-- Header -->

        <h1 class="text-2xl md:text-3xl font-bold">팔로워십 역량 자가 검사</h1>

    </header>

    <!-- App Content Area -->
    <div class="p-6 md:p-8" id="app-content">
        <!-- The content will be dynamically rendered here by JavaScript -->
    </div>
</div>

<!-- Footer / Download Button -->

</div>

        { id: 11, text: "리더나 조직의 목표에 크게 공헌할 수 있는 새로운 아이디어를 독자적으로 고안해서 적극적으로 제기하는가?", axis: "Y" },
        { id: 12, text: "어려운 문제(기술적인 것이든 조직적인 것이든)를 리더에게 의존해서 해결하기보다는 스스로 해결하려고 하는가?", axis: "Y" },
        { id: 13, text: "자신은 아무런 인정을 받지 못할 지라도 다른 동료들이 좋은 평가를 받도록 돕는가?", axis: "X" },
        { id: 14, text: "필요한 경우 일부러 반대 의견을 개진해서라도 리더와 집단(팀)의 아이디어, 계획의 상향 잠재력과 하향 위험성 모두를 볼 수 있도록 돕는가?", axis: "Y" },

        { id: 17, text: "지시받은 일만을 하는 데서 탈피해 리더가 내린 판단이 얼마나 현명한가를 스스로 평가해 보는 습관이 있는가?", axis: "Y" },

    // Followership Types Information based on "4. 로버트켈리_팔로워십_해설.pdf"

        "소외형": {

        },

                "리더의 판단에 철저히 따르며 지시된 선을 넘지 않음",

            ],

            description: "전체 팔로워의 약 5~10%를 차지하며 스스로 생각하고 알아서 행동할 줄 아는 이상적인 팔로워입니다. 능동적으로 참여하며 비판적 사고도 뛰어납니다.",
            pros: [

                "건설적인 비판을 하며 리더와도 용감하게 맞설 수 있음",

            ],
            cons: [
                "(과도할 경우) 주변 팀원들의 의욕을 상실시킬 수 있음",
                "다른 팀원들과 마음의 장막이나 벽이 생길 수 있음"
            ],
            coaching: [
                "현재의 뛰어난 역량을 유지하며 조직의 롤모델 역할 수행",

                "주변 사람들도 모범형으로 성장할 수 있도록 멘토링 제공",

    // --- State Variables ---
    let answers = {};
    let currentQuestionIndex = 0;
    let currentFollowerType = "";

    // --- Functions ---

    function startAssessment() {
        answers = {};
        currentQuestionIndex = 0;
        renderCard();
    }

    function renderCard() {
        const contentDiv = document.getElementById('app-content');
        const q = questions[currentQuestionIndex];
        
        // 진행률 계산 (현재 문항 수 / 전체 문항 수)
        const progressPercentage = Math.round((currentQuestionIndex / questions.length) * 100);
        
        let html = `
            <div class="relative bg-white border border-gray-200 rounded-xl p-6 md:p-10 shadow-sm min-h-[350px] flex flex-col">
                <!-- 우측 상단 진행률 -->
                <div class="absolute top-4 right-6 text-xs md:text-sm font-semibold text-blue-500 bg-blue-50 px-3 py-1 rounded-full">
                    진행률: ${progressPercentage}%
                </div>
                
                <div class="text-sm font-medium text-gray-400 mb-4">Question ${q.id} / ${questions.length}</div>
                
                <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-10 break-keep leading-tight">${q.text}</h3>

                <!-- 응답 버튼 (0~6점) -->
                <div class="flex justify-between items-stretch w-full gap-1 md:gap-2 mb-8 mt-auto">
        `;
        
        const scaleLabels = ["전혀<br>그렇지 않다", "그렇지 않다", "다소<br>그렇지 않다", "보통이다", "다소 그렇다", "그렇다", "매우 그렇다"];
        
        for (let i = 0; i <= 6; i++) {
            // 이전에 선택한 답변이 있다면 하이라이트 처리
            const isSelected = answers[q.id] === i;
            const btnClass = isSelected 
                ? "bg-blue-600 text-white border-blue-600 shadow-md transform scale-105" 
                : "bg-gray-50 text-gray-700 border-gray-200 hover:bg-blue-50 hover:border-blue-300";

            html += `
                    <button onclick="selectAnswer(${i})" class="flex-1 flex flex-col items-center justify-start p-2 md:p-3 rounded-lg border focus:outline-none transition-all duration-200 ${btnClass}">
                        <span class="text-lg md:text-xl font-bold mb-1">${i}</span>
                        <span class="text-[9px] md:text-[11px] text-center leading-tight opacity-80 break-keep">${scaleLabels[i]}</span>
                    </button>
            `;
        }
        
        html += `
                </div>

                <!-- 하단 네비게이션 -->
                <div class="flex justify-between pt-4 border-t border-gray-100">
                    <button onclick="prevQuestion()" class="${currentQuestionIndex === 0 ? 'invisible' : ''} text-gray-500 hover:text-blue-600 font-medium flex items-center transition-colors">
                        <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        이전 문항
                    </button>
                    <div class="text-xs text-gray-400 flex items-center">
                        원하는 점수를 클릭하면 다음으로 넘어갑니다.
                    </div>
                </div>
            </div>
        `;

        contentDiv.innerHTML = html;
        document.getElementById('footer-actions').style.display = 'none';
        window.scrollTo(0, 0);
    }

    function selectAnswer(val) {
        const q = questions[currentQuestionIndex];
        answers[q.id] = val;
        
        // 다음 문항으로 자동 이동
        if (currentQuestionIndex < questions.length - 1) {
            currentQuestionIndex++;
            renderCard();
        } else {
            // 마지막 문항이면 결과 계산
            calculateResults();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            renderCard();
        }
    }

    function calculateResults() {
        let scoreX = 0; // Active/Passive Engagement
        let scoreY = 0; // Independent/Dependent Thinking

        questions.forEach(q => {
            const val = answers[q.id];
            if (val !== undefined) {
                if (q.axis === 'X') {
                    scoreX += val;
                } else if (q.axis === 'Y') {
                    scoreY += val;
                }
            }
        });

        const type = determineType(scoreX, scoreY);
        currentFollowerType = followershipTypes[type].name; // AI 코치에 전달할 유형 이름 저장
        renderReport(scoreX, scoreY, type);
    }

    function determineType(x, y) {
        // Based on "3. 로버트켈리_팔로워십_유형.png"
        // X-axis: Active Engagement (0 - 60)
        // Y-axis: Independent Thinking (0 - 60)
        // Middle Box (Pragmatic): X [20, 40], Y [20, 40] -> Adjusting based on standard Kelley model mapping if specific thresholds are needed, 
        // but looking at image 3, pragmatics are bounded by inner box. 
        // Let's define the exact boundaries based on the image 3 coordinates:
        // X-axis (Engagement): Passive(0-30), Active(30-60). Inner box: 20-40
        // Y-axis (Thinking): Dependent(0-30), Independent(30-60). Inner box: 20-40

        if (x >= 20 && x <= 40 && y >= 20 && y <= 40) {
            return "실무형";
        } else if (x < 30 && y >= 30) {
            return "소외형";
        } else if (x >= 30 && y >= 30) {
            return "모범형";
        } else if (x < 30 && y < 30) {
            return "수동형";
        } else if (x >= 30 && y < 30) {
            return "순응형";
        }
        
        // Fallback (should not happen with strict boundaries, but just in case)
        return "실무형";
    }

    async function sendChatMessage() {
        const inputEl = document.getElementById('ai-chat-input');
        const text = inputEl.value.trim();
        if (!text) return;

        const chatBox = document.getElementById('ai-chat-box');
        
        // 1. 유저 메시지 화면에 추가
        chatBox.innerHTML += `
            <div class="text-right">
                <span class="inline-block bg-blue-500 text-white rounded-xl rounded-tr-none py-2 px-4 text-sm shadow-sm max-w-[85%] text-left">
                    ${text}
                </span>
            </div>
        `;
        inputEl.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // 2. 로딩 인디케이터 추가
        const loadingId = 'loading-' + Date.now();
        chatBox.innerHTML += `
            <div id="${loadingId}" class="text-left">
                <span class="inline-flex items-center bg-white border border-gray-200 text-gray-500 rounded-xl rounded-tl-none py-2 px-4 text-sm shadow-sm">
                    <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    코치가 답변을 작성 중입니다...
                </span>
            </div>
        `;
        chatBox.scrollTop = chatBox.scrollHeight;

        // 3. Gemini API 호출
        try {
            const systemPrompt = `당신은 로버트 켈리(Robert Kelley)의 팔로워십 모델에 정통한 조직 심리 전문가이자 전문 코치입니다. 현재 대화하고 있는 사용자의 팔로워십 진단 결과는 '${currentFollowerType}'입니다. 사용자의 질문에 전문적이고 친절하게, 그리고 실무에 즉시 적용할 수 있는 쉬운 개조식 문장 위주로 명확하게 답변해주세요.`;
            const payload = {
                contents: [{ role: "user", parts: [{ text: text }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };
            
            const apiKey = ""; // Canvas 환경에서 자동 주입됨
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            const reply = result.candidates?.[0]?.content?.parts?.[0]?.text || "죄송합니다. 응답을 생성하는 중 문제가 발생했습니다.";

            // 4. 로딩 제거 및 AI 응답 추가
            document.getElementById(loadingId).remove();
            
            // 간단한 마크다운 처리 (줄바꿈, 굵은 글씨)
            const formattedReply = reply.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
            
            chatBox.innerHTML += `
                <div class="text-left animate-fade-in-up">
                    <span class="inline-block bg-white border border-gray-200 text-gray-800 rounded-xl rounded-tl-none py-2 px-4 text-sm shadow-sm max-w-[85%]">
                        ${formattedReply}
                    </span>
                </div>
            `;
        } catch (e) {
            console.error(e);
            if (document.getElementById(loadingId)) {
                document.getElementById(loadingId).remove();
            }
            chatBox.innerHTML += `
                <div class="text-left">
                    <span class="inline-block bg-red-50 border border-red-200 text-red-800 rounded-xl rounded-tl-none py-2 px-4 text-sm shadow-sm">
                        통신 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.
                    </span>
                </div>
            `;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function generateChartHtml(x, y, currentType) {
        // SVG size
        const size = 300;
        const padding = 30;
        const innerSize = size - (padding * 2);
        
        // Map score 0-60 to coordinates
        const scale = innerSize / 60;
        const cx = padding + (x * scale);
        const cy = size - padding - (y * scale); // Y is inverted in SVG

        // Define quadrant colors based on Kelley's model colors from the provided images
        const colors = {
            alienated: "#fed7aa", // 소외형 (orange-200)
            exemplary: "#bbf7d0", // 모범형 (green-200)
            passive: "#e9d5ff",   // 수동형 (purple-200)
            conformist: "#e5e7eb", // 순응형 (gray-200)
            pragmatic: "#60a5fa"  // 실무형 (blue-400)
        };

        return `
        <div class="relative w-full max-w-[300px] aspect-square mx-auto bg-white border border-gray-300 rounded shadow-sm">
            <svg viewBox="0 0 ${size} ${size}" class="w-full h-full text-xs font-sans">
                <!-- Background Quadrants -->
                <rect x="${padding}" y="${padding}" width="${innerSize/2}" height="${innerSize/2}" fill="${colors.alienated}" opacity="0.6"/>
                <rect x="${padding + innerSize/2}" y="${padding}" width="${innerSize/2}" height="${innerSize/2}" fill="${colors.exemplary}" opacity="0.6"/>
                <rect x="${padding}" y="${padding + innerSize/2}" width="${innerSize/2}" height="${innerSize/2}" fill="${colors.passive}" opacity="0.6"/>
                <rect x="${padding + innerSize/2}" y="${padding + innerSize/2}" width="${innerSize/2}" height="${innerSize/2}" fill="${colors.conformist}" opacity="0.6"/>
                
                <!-- Pragmatic Box (Middle) -->
                <rect x="${padding + (20*scale)}" y="${size - padding - (40*scale)}" width="${20*scale}" height="${20*scale}" fill="${colors.pragmatic}" opacity="0.8" rx="5"/>
                
                <!-- Axis Lines -->
                <line x1="${padding}" y1="${size/2}" x2="${size-padding}" y2="${size/2}" stroke="#9ca3af" stroke-width="2"/>
                <line x1="${size/2}" y1="${padding}" x2="${size/2}" y2="${size-padding}" stroke="#9ca3af" stroke-width="2"/>

                <!-- Labels -->
                <text x="${size/2}" y="${padding - 10}" text-anchor="middle" class="fill-gray-600 font-bold">독립적/비판적 사고 (Y)</text>
                <text x="${size/2}" y="${size - padding + 20}" text-anchor="middle" class="fill-gray-600 font-bold">의존적/무비판적 사고</text>
                
                <!-- X axis labels (rotated or positioned to fit) -->
                <text x="${padding - 5}" y="${size/2}" text-anchor="end" alignment-baseline="middle" class="fill-gray-600 font-bold" transform="rotate(-90, ${padding - 5}, ${size/2})">수동적 참여 (X)</text>
                <text x="${size - padding + 5}" y="${size/2}" text-anchor="start" alignment-baseline="middle" class="fill-gray-600 font-bold" transform="rotate(90, ${size - padding + 5}, ${size/2})">능동적 참여</text>

                <!-- Quadrant Names -->
                <text x="${padding + innerSize/4}" y="${padding + innerSize/4}" text-anchor="middle" alignment-baseline="middle" class="fill-gray-700">소외형</text>
                <text x="${padding + (innerSize/4)*3}" y="${padding + innerSize/4}" text-anchor="middle" alignment-baseline="middle" class="fill-gray-700">모범형</text>
                <text x="${padding + innerSize/4}" y="${padding + (innerSize/4)*3}" text-anchor="middle" alignment-baseline="middle" class="fill-gray-700">수동형</text>
                <text x="${padding + (innerSize/4)*3}" y="${padding + (innerSize/4)*3}" text-anchor="middle" alignment-baseline="middle" class="fill-gray-700">순응형</text>
                <text x="${size/2}" y="${size/2}" text-anchor="middle" alignment-baseline="middle" class="fill-white font-bold">실무형</text>

                <!-- User Score Dot -->
                <circle cx="${cx}" cy="${cy}" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2" class="drop-shadow-md">
                    <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" />
                </circle>
            </svg>
        </div>
        `;
    }

    function downloadReport() {
        const captureArea = document.getElementById('capture-area');
        
        // 캡처 전 불필요한 UI 숨김 처리
        const chatInputArea = document.getElementById('ai-chat-input-area');
        const retryBtnArea = document.getElementById('retry-btn-area');
        if (chatInputArea) chatInputArea.style.display = 'none';
        if (retryBtnArea) retryBtnArea.style.display = 'none';

        // Brief message to user
        const btn = document.querySelector('button[onclick="downloadReport()"]');
        const originalText = btn.innerHTML;
        btn.innerHTML = '다운로드 준비 중...';
        btn.disabled = true;

        html2canvas(captureArea, {
            scale: 2, // High resolution
            useCORS: true,
            backgroundColor: '#ffffff'
        }).then(canvas => {
            // Create image data
            const imgData = canvas.toDataURL('image/jpeg', 0.9);
            
            // Create download link
            const link = document.createElement('a');
            link.href = imgData;
            link.download = `팔로워십_진단결과_${new Date().toISOString().slice(0,10)}.jpg`;
            
            // Trigger download
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // Reset button & UI
            btn.innerHTML = originalText;
            btn.disabled = false;
            if (chatInputArea) chatInputArea.style.display = 'flex';
            if (retryBtnArea) retryBtnArea.style.display = 'block';
        }).catch(err => {
            console.error("이미지 저장 실패:", err);
            alert("이미지를 저장하는 중 문제가 발생했습니다.");
            btn.innerHTML = originalText;
            btn.disabled = false;
            if (chatInputArea) chatInputArea.style.display = 'flex';
            if (retryBtnArea) retryBtnArea.style.display = 'block';
        });
    }

    // Initialize the app
    window.onload = () => {
        startAssessment();
    };
</script>
